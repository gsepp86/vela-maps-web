<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vela Maps">
<meta name="theme-color" content="#1c1c1e">
<title>Vela Maps 3D</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🧭%3C/text%3E%3C/svg%3E">
<link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet">
<style>
:root{--glass:rgba(28,28,30,.92);--line:rgba(255,255,255,.14);--blue:#0a84ff;--green:#30d158;--red:#ff453a;--mut:#a1a1a6;--top:env(safe-area-inset-top,0px);--bot:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Roboto,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
html,body,#map{height:100%;width:100%;overflow:hidden;background:#1c1c1e;color:#fff}
button{font:inherit;cursor:pointer;border:0;color:#fff}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid var(--line);box-shadow:0 6px 24px rgba(0,0,0,.45)}

/* Ricerca */
#searchBox{position:fixed;z-index:1000;left:50%;transform:translateX(-50%);bottom:calc(24px + var(--bot));width:calc(100% - 32px);max-width:480px;border-radius:24px;padding:6px 8px 6px 10px;display:none;gap:6px}
body[data-mode=search] #searchBox{display:flex}
#searchInput{flex:1;min-width:0;border:0;background:transparent;color:#fff;font-size:16px;padding:8px 6px;outline:0}
#searchBox button{background:var(--blue);padding:8px 16px;border-radius:18px;font-weight:600}
#searchBox .mic{background:transparent;width:38px;height:38px;padding:0;font-size:20px}
#searchBox .mic.rec{background:var(--red);border-radius:50%}
#results{position:fixed;z-index:1000;left:50%;transform:translateX(-50%);bottom:calc(86px + var(--bot));width:calc(100% - 32px);max-width:480px;border-radius:18px;display:none;overflow:hidden}
#results button{display:block;width:100%;text-align:left;background:none;padding:11px 16px;border-bottom:1px solid var(--line)}
#results button:last-child{border:0}
#results small{display:block;color:var(--mut);font-size:12px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Controlli */
.controls{position:fixed;z-index:1000;right:14px;bottom:calc(100px + var(--bot));display:flex;flex-direction:column;gap:10px;transition:bottom .3s}
body[data-mode=place] .controls{bottom:calc(310px + var(--bot))}
body[data-mode=nav] .controls{bottom:calc(120px + var(--bot))}
.btn{width:46px;height:46px;border-radius:50%;font-size:19px;background:var(--glass);border:1px solid var(--line);box-shadow:0 4px 16px rgba(0,0,0,.4)}
.btn.active{background:var(--blue);border-color:var(--blue)}

/* Schede in basso */
.sheet{position:fixed;z-index:1002;left:0;right:0;bottom:0;background:#1c1c1e;border-radius:24px 24px 0 0;padding:22px 20px calc(18px + var(--bot));border-top:1px solid var(--line);box-shadow:0 -6px 24px rgba(0,0,0,.6);transform:translateY(110%);transition:transform .35s cubic-bezier(.1,.9,.2,1)}
body[data-mode=place] #placeCard,body[data-mode=nav] #navBar{transform:none}
.title{font-size:20px;font-weight:700;margin:0 36px 6px 0}
.sub{font-size:13px;color:var(--mut);line-height:1.4;margin-bottom:14px;max-height:36px;overflow:hidden}
.x{position:absolute;top:14px;right:14px;width:32px;height:32px;border-radius:50%;background:#3a3a3c}
.row{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.row select{background:#2c2c2e;color:#fff;border:1px solid var(--line);padding:8px 10px;border-radius:10px;font-size:14px}
#routeInfo{font-weight:600;color:var(--green)}
.go{width:100%;background:var(--green);color:#000;font-weight:700;padding:14px;border-radius:14px;font-size:16px}
.sim{width:100%;margin-top:8px;background:#2c2c2e;padding:11px;border-radius:14px;font-size:14px}
#navBar{display:flex;align-items:center;justify-content:space-between}
#navTime{font-size:26px;font-weight:700;color:var(--green)}
#navDetails{font-size:14px;color:var(--mut);margin-top:2px}
.stop{background:var(--red);padding:12px 22px;border-radius:16px;font-weight:700;font-size:16px}

/* Banner svolta */
#turn{position:fixed;z-index:1002;top:calc(10px + var(--top));left:10px;right:10px;display:none;align-items:center;gap:14px;padding:12px 16px;border-radius:18px;background:#12602b;border:1px solid #1f8f43;box-shadow:0 6px 24px rgba(0,0,0,.45)}
body[data-mode=nav] #turn{display:flex}
#turnIcon{font-size:38px;width:46px;text-align:center}
#turnDist{font-size:22px;font-weight:700}
#turnTxt{font-size:14px;opacity:.9}
#toast{position:fixed;z-index:1003;left:50%;top:calc(var(--top) + 100px);transform:translate(-50%,-10px);background:rgba(0,0,0,.85);padding:10px 16px;border-radius:14px;font-size:14px;max-width:calc(100% - 32px);text-align:center;opacity:0;pointer-events:none;transition:.25s}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* Posizione utente */
.me{width:22px;height:22px;border-radius:50%;background:var(--blue);border:3px solid #fff;box-shadow:0 0 12px rgba(10,132,255,.9);position:relative}
.me i{display:none;position:absolute;left:50%;top:-13px;margin-left:-7px;border-left:7px solid transparent;border-right:7px solid transparent;border-bottom:11px solid var(--blue)}
.me.h i{display:block}
</style>
</head>
<body data-mode="search">

<div id="map"></div>

<div id="turn"><div id="turnIcon">↑</div><div><div id="turnDist">--</div><div id="turnTxt">--</div></div></div>
<div id="toast"></div>

<div class="controls">
  <button class="btn active" id="btnCams" onclick="toggleCams()" title="Autovelox">📷</button>
  <button class="btn" id="btnTraffic" onclick="toggleTraffic()" title="Traffico">🚥</button>
  <button class="btn" id="btnCompass" onclick="toggleCompass()" title="Bussola">🧭</button>
  <button class="btn" id="btnVoice" onclick="toggleVoice()" title="Voce">🔊</button>
  <button class="btn active" id="btnLoc" onclick="locate()" title="La mia posizione">📍</button>
</div>

<div id="results" class="glass"></div>
<div id="searchBox" class="glass">
  <input id="searchInput" type="search" placeholder="Cerca bar, ristoranti, indirizzi..." enterkeyhint="search" autocomplete="off">
  <button id="btnMic" class="mic" onclick="voiceSearch()" aria-label="Ricerca vocale">🎤</button>
  <button onclick="searchPlace()">Cerca</button>
</div>

<div id="placeCard" class="sheet">
  <button class="x" onclick="endTrip()" aria-label="Chiudi">✕</button>
  <div class="title" id="cardTitle"></div>
  <div class="sub" id="cardSub"></div>
  <div class="row">
    <select id="routeType" onchange="previewRoute(false)">
      <option value="fastest">Più veloce</option>
      <option value="shortest">Più breve</option>
      <option value="notolls">Evita pedaggi</option>
    </select>
    <div id="routeInfo"></div>
  </div>
  <button class="go" onclick="startNavigation()">Avvia navigazione 3D</button>
  <button class="sim" onclick="simulate()">Simula il percorso (prova voce e bussola)</button>
</div>

<div id="navBar" class="sheet">
  <div><div id="navTime">-- min</div><div id="navDetails">Calcolo…</div></div>
  <button class="stop" onclick="endTrip();speak('Navigazione terminata.')">Esci</button>
</div>

<script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
<script>
/* ===== Configurazione ===== */
const CONFIG = {
  STYLE: 'https://tiles.openfreemap.org/styles/liberty',      // mappa vettoriale con edifici 3D
  VALHALLA: 'https://valhalla1.openstreetmap.de/route',       // routing + istruzioni in italiano
  NOMINATIM: 'https://nominatim.openstreetmap.org/search',    // ricerca luoghi
  OVERPASS: 'https://overpass-api.de/api/interpreter',       // autovelox da OpenStreetMap
  TOMTOM_KEY: ''                                              // opzionale: chiave gratuita TomTom per il traffico
};

/* ===== Stato ===== */
const $ = id => document.getElementById(id);
const EMPTY = { type: 'FeatureCollection', features: [] };
const ARROWS = {4:'⚑',5:'⚑',6:'⚑',9:'↗',10:'→',11:'↘',12:'↷',13:'↶',14:'↙',15:'←',16:'↖',18:'↗',19:'↖',20:'↗',21:'↖',23:'↗',24:'↖',26:'⟳',27:'⟳'};
let mode = 'search', user = null, gpsHeading = null, speedMs = 0, devH = null, watchId = null;
let marker = null, destMarker = null, dest = null, route = null, reqId = 0;
let follow = true, voiceOn = true, camsOn = true, trafficOn = false, headingUp = false, simOn = false, simTimer = null;
let stepIdx = 1, announced = 0, minD = Infinity, offCount = 0, navDone = false, noReroute = 0, rerouting = false;
let camList = [], camBB = null, camBusy = false, camRetry = 0, spokenCams = new Set();
let wl = null, toastT;

/* ===== Utilità ===== */
const rad = d => d * Math.PI / 180;
const angDiff = (a, b) => ((a - b + 540) % 360) - 180;
const fmtMin = s => { const m = Math.max(1, Math.round(s / 60)); return m >= 60 ? `${Math.floor(m / 60)} h ${m % 60} min` : `${m} min`; };
const fmtDist = d => d >= 1000 ? (d / 1000).toFixed(1) + ' km' : Math.max(10, Math.round(d / 10) * 10) + ' m';

function toast(t) {
  const e = $('toast'); e.textContent = t; e.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => e.classList.remove('show'), 3500);
}
async function getJSON(url, ms = 15000) {
  const c = new AbortController(), t = setTimeout(() => c.abort(), ms);
  try { const r = await fetch(url, { signal: c.signal }); if (!r.ok) throw new Error(r.status); return await r.json(); }
  finally { clearTimeout(t); }
}
function dist(a, b) { // metri tra [lng,lat]
  const dLat = rad(b[1] - a[1]), dLon = rad(b[0] - a[0]);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a[1])) * Math.cos(rad(b[1])) * Math.sin(dLon / 2) ** 2;
  return 2 * 6371e3 * Math.asin(Math.sqrt(h));
}
function bearing(a, b) {
  const y = Math.sin(rad(b[0] - a[0])) * Math.cos(rad(b[1]));
  const x = Math.cos(rad(a[1])) * Math.sin(rad(b[1])) - Math.sin(rad(a[1])) * Math.cos(rad(b[1])) * Math.cos(rad(b[0] - a[0]));
  return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
}
function distToRoute(p, shape) { // distanza minima punto-polilinea (m)
  const k = Math.cos(rad(p[1])) * 111320, m = 111320; let best = Infinity;
  for (let i = 0; i < shape.length - 1; i++) {
    const ax = (shape[i][0] - p[0]) * k, ay = (shape[i][1] - p[1]) * m;
    const dx = (shape[i + 1][0] - p[0]) * k - ax, dy = (shape[i + 1][1] - p[1]) * m - ay, l = dx * dx + dy * dy;
    const t = l ? Math.max(0, Math.min(1, -(ax * dx + ay * dy) / l)) : 0;
    best = Math.min(best, Math.hypot(ax + t * dx, ay + t * dy));
  }
  return best;
}
function decodePolyline(s, prec = 6) {
  const f = 10 ** prec; let i = 0, lat = 0, lng = 0; const out = [];
  const next = () => { let b, sh = 0, r = 0; do { b = s.charCodeAt(i++) - 63; r |= (b & 31) << sh; sh += 5; } while (b >= 32); return r & 1 ? ~(r >> 1) : r >> 1; };
  while (i < s.length) { lat += next(); lng += next(); out.push([lng / f, lat / f]); }
  return out;
}

/* ===== Voce ===== */
let itVoice = null, curUtt = null, speakT = 0, ac = null;
function pickVoice() {
  if (!('speechSynthesis' in window)) return;
  const it = speechSynthesis.getVoices().filter(v => /^it/i.test(v.lang.replace('_', '-')));
  itVoice = it.find(v => /alice|luca|federica|paola|elsa|cosimo|google/i.test(v.name)) || it[0] || null;
}
pickVoice();
if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = pickVoice;

function beep() { // segnale acustico di riserva se la sintesi vocale non parte
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)(); ac.resume();
    const o = ac.createOscillator(), g = ac.createGain();
    o.frequency.value = 880; g.gain.value = .25; o.connect(g); g.connect(ac.destination);
    o.start(); o.stop(ac.currentTime + .25);
  } catch (e) {}
}
// primo tocco: sblocca audio e voce (iOS li consente solo dopo un gesto dell'utente)
function unlockAudio() {
  removeEventListener('touchend', unlockAudio); removeEventListener('click', unlockAudio);
  try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); ac.resume(); } catch (e) {}
  if ('speechSynthesis' in window) { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speakT = Date.now(); speechSynthesis.speak(u); }
}
addEventListener('touchend', unlockAudio); addEventListener('click', unlockAudio);

function speak(text, check = false) {
  if (!voiceOn || !text || !('speechSynthesis' in window)) return;
  const go = retry => {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'it-IT'; if (itVoice && !retry) u.voice = itVoice;
    let started = false;
    u.onstart = () => { started = true; };
    u.onerror = e => { if (e.error !== 'interrupted' && e.error !== 'canceled') toast('Voce: ' + e.error); };
    curUtt = u; // tiene un riferimento: senza, Chrome può interrompere la voce a metà
    if (speechSynthesis.paused) speechSynthesis.resume();
    speechSynthesis.speak(u);
    if (check) setTimeout(() => { // controllo: se non è partita, riprova senza voce forzata, poi segnala il problema
      if (started || curUtt !== u) return;
      if (!retry) { speechSynthesis.cancel(); setTimeout(() => go(true), 150); }
      else { beep(); toast(`Voce bloccata dal browser (voci installate: ${speechSynthesis.getVoices().length})`); }
    }, 2000);
  };
  // cancel() seguito subito da speak() viene ignorato da iOS/Chrome: si aspetta un attimo,
  // e un messaggio appena partito non viene tagliato ma messo in coda
  const busy = speechSynthesis.speaking || speechSynthesis.pending, stale = Date.now() - speakT > 2500;
  speakT = Date.now();
  if (busy && stale) { speechSynthesis.cancel(); setTimeout(go, 120); } else go();
}
function toggleVoice() {
  voiceOn = !voiceOn; $('btnVoice').textContent = voiceOn ? '🔊' : '🔇';
  if (!('speechSynthesis' in window)) return toast('Il browser non supporta la sintesi vocale');
  if (!voiceOn) return speechSynthesis.cancel();
  pickVoice(); speak('Voce attiva.', true);
  toast(itVoice ? `Voce: ${itVoice.name}` : 'Nessuna voce italiana installata: uso quella predefinita');
}

/* ===== Mappa ===== */
const map = new maplibregl.Map({ container: 'map', style: CONFIG.STYLE, center: [12.4964, 41.9028], zoom: 6, maxPitch: 75, attributionControl: { compact: true } });
map.on('error', () => { if (!map.isStyleLoaded()) toast('Errore nel caricamento della mappa'); });
map.on('load', () => {
  const before = map.getStyle().layers.find(l => l.type === 'symbol')?.id;
  if (CONFIG.TOMTOM_KEY) {
    map.addSource('traffic', { type: 'raster', tileSize: 256, tiles: [`https://api.tomtom.com/traffic/map/4/tile/flow/relative/{z}/{x}/{y}.png?key=${CONFIG.TOMTOM_KEY}&tileSize=256`] });
    map.addLayer({ id: 'traffic', type: 'raster', source: 'traffic', layout: { visibility: 'none' } }, before);
  }
  map.addSource('route', { type: 'geojson', data: EMPTY });
  const lay = { 'line-join': 'round', 'line-cap': 'round' };
  map.addLayer({ id: 'route-casing', type: 'line', source: 'route', layout: lay, paint: { 'line-color': '#0a3d91', 'line-width': 12 } }, before);
  map.addLayer({ id: 'route', type: 'line', source: 'route', layout: lay, paint: { 'line-color': '#0a84ff', 'line-width': 8 } }, before);
  map.addSource('cams', { type: 'geojson', data: EMPTY });
  map.addLayer({ id: 'cams', type: 'circle', source: 'cams', paint: { 'circle-radius': ['interpolate', ['linear'], ['zoom'], 11, 4, 17, 9], 'circle-color': '#ff453a', 'circle-stroke-color': '#fff', 'circle-stroke-width': 2 } });
  loadCams();
});
setInterval(loadCams, 2500);
map.on('click', () => { $('results').style.display = 'none'; });
['dragstart', 'zoomstart', 'rotatestart', 'pitchstart'].forEach(ev => map.on(ev, e => { if (!e.originalEvent) return; if (mode === 'nav') setFollow(false); else if (ev === 'rotatestart') setHeadingUp(false); }));

function setFollow(v) { follow = v; $('btnLoc').classList.toggle('active', v); }
function setMode(m) { mode = m; document.body.dataset.mode = m; $('results').style.display = 'none'; }

/* ===== GPS, bussola e camera ===== */
let sensorOn = false, camB = 0, camPos = null, camZ = 14, camP = 0, camT = 0, mkH = null;
// direzione corrente: rotta GPS se ci muoviamo, altrimenti bussola del telefono
const curHeading = () => speedMs > 1.5 && gpsHeading != null ? gpsHeading : (devH ?? gpsHeading);

function startGPS() {
  if (!navigator.geolocation) return toast('GPS non disponibile');
  if (watchId != null) return;
  watchId = navigator.geolocation.watchPosition(onPos, e => toast('GPS: ' + e.message), { enableHighAccuracy: true, maximumAge: 1000, timeout: 15000 });
}
function onPos(p) {
  if (simOn && !p.sim) return; // durante la simulazione si ignora il GPS reale
  const c = p.coords, first = !user;
  user = [c.longitude, c.latitude]; speedMs = Math.max(0, c.speed || 0);
  if (c.heading != null && !isNaN(c.heading) && speedMs > 1.5) gpsHeading = c.heading;
  if (!marker) {
    const el = document.createElement('div'); el.className = 'me'; el.innerHTML = '<i></i>';
    marker = new maplibregl.Marker({ element: el, rotationAlignment: 'map' }).setLngLat(user).addTo(map);
  }
  if (!(mode === 'nav' && follow)) marker.setLngLat(user); // in navigazione lo muove camLoop
  if (mode === 'nav') tickNav(user);
  else if (first && mode === 'search') map.flyTo({ center: user, zoom: 14 });
  else if (first && mode === 'place') previewRoute(true);
}
function locate() {
  startGPS(); setFollow(true);
  if (user && mode !== 'nav') map.easeTo({ center: user, zoom: 15 });
}

/* Bussola: iOS dà webkitCompassHeading; Android dà alpha/beta/gamma assoluti.
   Telefono in verticale (supporto auto) = direzione del retro; orizzontale = direzione della parte alta. */
function onOrient(e) {
  let h = null;
  if (e.webkitCompassHeading != null) h = e.webkitCompassHeading;
  else if (e.absolute && e.alpha != null) {
    const x = rad(e.beta || 0), y = rad(e.gamma || 0), z = rad(e.alpha);
    const vx = -Math.cos(z) * Math.sin(y) - Math.sin(z) * Math.sin(x) * Math.cos(y);
    const vy = -Math.sin(z) * Math.sin(y) + Math.cos(z) * Math.sin(x) * Math.cos(y);
    h = Math.hypot(vx, vy) > .7 ? (Math.atan2(vx, vy) * 180 / Math.PI + 360) % 360
                                : (360 - e.alpha + (screen.orientation?.angle || 0) + 360) % 360;
  }
  if (h != null) devH = devH == null ? h : (devH + angDiff(h, devH) * .3 + 360) % 360;
}
async function enableSensors() {
  if (sensorOn) return true;
  try {
    if (typeof DeviceOrientationEvent !== 'undefined' && DeviceOrientationEvent.requestPermission && await DeviceOrientationEvent.requestPermission() !== 'granted') {
      toast('Permesso bussola negato: Impostazioni › Safari › Movimento e orientamento'); return false;
    }
  } catch (e) { toast('Bussola non disponibile'); return false; }
  addEventListener('deviceorientation', onOrient); addEventListener('deviceorientationabsolute', onOrient);
  sensorOn = true; return true;
}
function setHeadingUp(v) { headingUp = v; $('btnCompass').classList.toggle('active', v); }
async function toggleCompass() { // mappa orientata nella direzione di marcia / nord in alto
  if (!headingUp && !(await enableSensors()) && mode !== 'nav') return;
  setHeadingUp(!headingUp);
  if (!headingUp && mode !== 'nav') map.easeTo({ bearing: 0 });
  if (headingUp) setTimeout(() => { if (headingUp && devH == null && speedMs < 1.5) toast('Il dispositivo non fornisce dati della bussola'); }, 2500);
}

/* Un solo ciclo di camera: evita che bussola e navigazione si contendano la mappa */
function camLoop(t) {
  requestAnimationFrame(camLoop);
  const dt = Math.min(.1, (t - camT) / 1000) || .016; camT = t;
  const h = curHeading();
  if (marker && h != null && (mkH == null || Math.abs(angDiff(h, mkH)) > 1)) { mkH = h; marker.setRotation(h); marker.getElement().classList.add('h'); }
  const navFollow = mode === 'nav' && follow && user, compassMode = mode !== 'nav' && headingUp && devH != null;
  if (!navFollow && !compassMode) { camPos = null; camB = (map.getBearing() + 360) % 360; camZ = map.getZoom(); camP = map.getPitch(); return; }
  const k = tau => 1 - Math.exp(-dt / tau);
  const want = !headingUp ? 0 : mode === 'nav' ? (h ?? camB) : devH;
  camB = (camB + angDiff(want, camB) * k(.25) + 360) % 360;
  if (!navFollow) return map.setBearing(camB);
  const c = camPos || [map.getCenter().lng, map.getCenter().lat];
  camPos = [c[0] + (user[0] - c[0]) * k(.4), c[1] + (user[1] - c[1]) * k(.4)];
  camZ += (17 - camZ) * k(.6); camP += (60 - camP) * k(.6);
  marker?.setLngLat(camPos);
  map.easeTo({ center: camPos, zoom: camZ, pitch: camP, bearing: camB, offset: [0, innerHeight * .2], duration: 0 });
}
requestAnimationFrame(camLoop);

/* ===== Autovelox (OpenStreetMap / Overpass) ===== */
async function loadCams() {
  if (!camsOn || camBusy || !map.getSource('cams') || map.getZoom() < 11 || Date.now() < camRetry) return;
  const b = map.getBounds(), c = map.getCenter();
  if (camBB && b.getSouth() >= camBB[0] && b.getWest() >= camBB[1] && b.getNorth() <= camBB[2] && b.getEast() <= camBB[3]) return;
  const bb = [Math.min(b.getSouth(), c.lat - .05), Math.min(b.getWest(), c.lng - .07), Math.max(b.getNorth(), c.lat + .05), Math.max(b.getEast(), c.lng + .07)];
  camBusy = true;
  try {
    const q = `[out:json][timeout:20];node["highway"="speed_camera"](${bb.join(',')});out 800;`;
    const d = await getJSON(`${CONFIG.OVERPASS}?data=${encodeURIComponent(q)}`, 25000);
    camList = d.elements.map(e => ({ id: e.id, ll: [e.lon, e.lat], max: e.tags?.maxspeed }));
    map.getSource('cams').setData({ type: 'FeatureCollection', features: camList.map(c => ({ type: 'Feature', geometry: { type: 'Point', coordinates: c.ll }, properties: {} })) });
    camBB = bb;
  } catch (e) { camRetry = Date.now() + 30000; }
  finally { camBusy = false; }
}
function toggleCams() {
  camsOn = !camsOn; $('btnCams').classList.toggle('active', camsOn);
  if (map.getLayer('cams')) map.setLayoutProperty('cams', 'visibility', camsOn ? 'visible' : 'none');
  if (camsOn) loadCams();
}
function checkCams(pos) {
  if (!camsOn) return;
  for (const c of camList) {
    if (spokenCams.has(c.id)) continue;
    const d = dist(pos, c.ll);
    if (d < 350 && distToRoute(c.ll, route.shape) < 35 && (gpsHeading == null || Math.abs(angDiff(bearing(pos, c.ll), gpsHeading)) < 60)) {
      spokenCams.add(c.id);
      const txt = `Attenzione, autovelox tra ${Math.max(50, Math.round(d / 50) * 50)} metri` + (c.max ? `, limite ${c.max}` : '');
      speak(txt); toast('📷 ' + txt); break;
    }
  }
}

/* ===== Traffico (richiede chiave TomTom) ===== */
function toggleTraffic() {
  if (!CONFIG.TOMTOM_KEY) return toast('Traffico: inserisci una chiave TomTom gratuita in CONFIG.TOMTOM_KEY');
  trafficOn = !trafficOn; $('btnTraffic').classList.toggle('active', trafficOn);
  map.setLayoutProperty('traffic', 'visibility', trafficOn ? 'visible' : 'none');
}

/* ===== Ricerca ===== */
async function searchPlace() {
  const q = $('searchInput').value.trim(); if (!q) return;
  $('searchInput').blur();
  const c = map.getCenter();
  try {
    const d = await getJSON(`${CONFIG.NOMINATIM}?format=jsonv2&limit=5&accept-language=it&q=${encodeURIComponent(q)}&viewbox=${c.lng - 1},${c.lat + 1},${c.lng + 1},${c.lat - 1}`);
    if (!d.length) return toast('Nessun luogo trovato');
    if (d.length === 1) return selectPlace(d[0]);
    const box = $('results'); box.innerHTML = '';
    d.forEach(p => {
      const [n, ...r] = p.display_name.split(',');
      const b = document.createElement('button'), s = document.createElement('small');
      b.textContent = n; s.textContent = r.slice(0, 3).join(',').trim(); b.append(s);
      b.onclick = () => selectPlace(p); box.append(b);
    });
    box.style.display = 'block';
  } catch (e) { toast('Errore durante la ricerca'); }
}
$('searchInput').addEventListener('keydown', e => { if (e.key === 'Enter') searchPlace(); });

function selectPlace(p) {
  dest = [+p.lon, +p.lat];
  destMarker?.remove();
  destMarker = new maplibregl.Marker({ color: '#ff3b30' }).setLngLat(dest).addTo(map);
  $('cardTitle').textContent = p.display_name.split(',')[0];
  $('cardSub').textContent = p.display_name;
  setMode('place'); startGPS(); previewRoute(true);
}

/* ===== Ricerca vocale ===== */
let rec = null;
function voiceSearch() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return toast('Ricerca vocale non supportata qui: usa il microfono della tastiera');
  if (rec) { rec.stop(); return; }
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  const input = $('searchInput'), btn = $('btnMic'), ph = input.placeholder;
  rec = new SR(); rec.lang = 'it-IT'; rec.interimResults = true;
  rec.onstart = () => { btn.classList.add('rec'); input.placeholder = 'Ti ascolto…'; input.value = ''; };
  rec.onresult = e => {
    const r = e.results[e.results.length - 1]; input.value = r[0].transcript;
    if (r.isFinal) searchPlace();
  };
  rec.onerror = e => toast({ 'not-allowed': 'Permesso microfono negato', 'service-not-allowed': 'Riconoscimento vocale non consentito (attiva Siri e Dettatura)', 'no-speech': 'Non ho sentito nulla', 'network': 'Serve la connessione a internet' }[e.error] || 'Errore microfono: ' + e.error);
  rec.onend = () => { rec = null; btn.classList.remove('rec'); input.placeholder = ph; };
  try { rec.start(); } catch (e) { rec = null; toast('Microfono non disponibile'); }
}

/* ===== Percorso (Valhalla) ===== */
async function computeRoute(from, to) {
  const t = $('routeType').value, auto = {};
  if (t === 'shortest') auto.shortest = true;
  if (t === 'notolls') auto.use_tolls = 0;
  const body = {
    locations: [{ lat: from[1], lon: from[0] }, { lat: to[1], lon: to[0] }],
    costing: 'auto', costing_options: { auto },
    directions_options: { language: 'it-IT', units: 'kilometers' }
  };
  const d = await getJSON(`${CONFIG.VALHALLA}?json=${encodeURIComponent(JSON.stringify(body))}`);
  const leg = d.trip.legs[0];
  return { shape: decodePolyline(leg.shape), steps: leg.maneuvers, km: d.trip.summary.length, sec: d.trip.summary.time };
}
function setRoute(r) {
  r.rem = new Array(r.steps.length + 1).fill(0); // km residui da ogni manovra
  for (let i = r.steps.length - 1; i >= 0; i--) r.rem[i] = r.rem[i + 1] + r.steps[i].length;
  route = r;
  map.getSource('route')?.setData({ type: 'Feature', geometry: { type: 'LineString', coordinates: r.shape } });
}
async function previewRoute(fit) {
  if (!dest) return;
  const id = ++reqId;
  const c0 = map.getCenter(), from = user || [c0.lng, c0.lat];
  $('routeInfo').textContent = user ? 'Calcolo…' : 'GPS non attivo: calcolo dal centro mappa…';
  try {
    const r = await computeRoute(from, dest);
    if (id !== reqId) return;
    setRoute(r); $('routeInfo').textContent = `${fmtMin(r.sec)} · ${r.km.toFixed(1)} km${user ? '' : ' · da centro mappa'}`;
    if (fit) {
      const s = r.shape, b = s.reduce((b, c) => b.extend(c), new maplibregl.LngLatBounds(s[0], s[0]));
      map.fitBounds(b, { padding: { top: 60, bottom: 320, left: 40, right: 70 }, pitch: 0, bearing: 0, maxZoom: 16, duration: 900 });
    }
  } catch (e) {
    if (id !== reqId) return;
    route = null; map.getSource('route')?.setData(EMPTY);
    $('routeInfo').textContent = 'Percorso non trovato'; map.flyTo({ center: dest, zoom: 15 });
  }
}

/* ===== Navigazione ===== */
function startNavigation() {
  if (!route || !user) return toast('Percorso non ancora pronto');
  setMode('nav'); setFollow(true); setHeadingUp(true);
  stepIdx = 1; announced = 0; minD = Infinity; offCount = 0; navDone = false; spokenCams = new Set();
  acquireWake();
  speak(`Navigazione avviata. ${route.steps[0]?.instruction || ''}`, true); enableSensors();
  tickNav(user);
}
function tickNav(pos) {
  if (!route || navDone) return;
  const st = route.steps[stepIdx];
  if (distToRoute(pos, route.shape) > 50) { if (++offCount >= 3) reroute(); } else offCount = 0;
  if (!st) return;
  const d = dist(pos, route.shape[st.begin_shape_index]);
  minD = Math.min(minD, d);
  const far = Math.min(800, Math.max(200, speedMs * 14));
  if (announced < 1 && d < far && d > 60) {
    announced = 1; speak(`Tra ${Math.max(50, Math.round(d / 50) * 50)} metri, ${st.verbal_pre_transition_instruction || st.instruction}`);
  }
  if (announced < 2 && d < 50) { announced = 2; speak(st.verbal_transition_alert_instruction || st.instruction); }
  if (d < 25 || (minD < 70 && d > minD + 20)) { // manovra raggiunta o appena superata
    if (st.type >= 4 && st.type <= 6) return arrived();
    stepIdx++; announced = 0; minD = Infinity; return tickNav(pos);
  }
  const remKm = d / 1000 + route.rem[stepIdx], remSec = route.sec * remKm / route.km;
  $('turnIcon').textContent = ARROWS[st.type] || '↑';
  $('turnDist').textContent = fmtDist(d);
  $('turnTxt').textContent = st.instruction;
  $('navTime').textContent = fmtMin(remSec);
  $('navDetails').textContent = `${remKm.toFixed(1)} km • arrivo ${new Date(Date.now() + remSec * 1e3).toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' })}`;
  checkCams(pos);
}
async function reroute() {
  if (rerouting || Date.now() < noReroute) return;
  rerouting = true; noReroute = Date.now() + 10000;
  speak('Ricalcolo del percorso.');
  try {
    setRoute(await computeRoute(user, dest));
    stepIdx = 1; announced = 0; minD = Infinity; offCount = 0;
  } catch (e) { toast('Ricalcolo non riuscito'); }
  finally { rerouting = false; }
}
function arrived() {
  navDone = true; speak('Sei arrivato a destinazione.'); toast('🏁 Sei arrivato a destinazione');
  setTimeout(endTrip, 6000);
}
function endTrip() {
  setMode('search'); route = null; dest = null; reqId++;
  destMarker?.remove(); destMarker = null;
  map.getSource('route')?.setData(EMPTY);
  releaseWake(); setFollow(true); setHeadingUp(false); clearInterval(simTimer); simOn = false;
  map.easeTo({ pitch: 0, bearing: 0, zoom: 14, ...(user ? { center: user } : {}) });
}

/* ===== Simulazione (per provare voce e bussola senza guidare) ===== */
function simulate() {
  if (!route) return toast('Percorso non ancora pronto');
  const pts = route.shape; let i = 1, p = pts[0].slice();
  simOn = true;
  const fix = h => onPos({ sim: true, coords: { longitude: p[0], latitude: p[1], heading: h, speed: 16 } });
  fix(bearing(p, pts[1])); startNavigation();
  clearInterval(simTimer);
  simTimer = setInterval(() => {
    let step = 16; // metri al secondo (~58 km/h)
    while (step > 0 && i < pts.length) {
      const d = dist(p, pts[i]);
      if (d <= step) { step -= d; p = pts[i].slice(); i++; }
      else { const f = step / d; p = [p[0] + (pts[i][0] - p[0]) * f, p[1] + (pts[i][1] - p[1]) * f]; step = 0; }
    }
    if (i >= pts.length) clearInterval(simTimer);
    fix(i < pts.length ? bearing(p, pts[i]) : null);
  }, 1000);
}

/* ===== Schermo sempre acceso in navigazione ===== */
async function acquireWake() { try { wl = await navigator.wakeLock?.request('screen'); } catch (e) {} }
function releaseWake() { wl?.release().catch(() => {}); wl = null; }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && mode === 'nav') acquireWake(); });

startGPS();
</script>
</body>
