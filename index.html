<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Vela Maps" />
  <title>Vela Maps Web 3D</title>
  
  <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-blue.png" />
  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-blue.png" />
  
  <!-- MapLibre GL 3D Engine -->
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Roboto, "Segoe UI", sans-serif;
    }

    html, body, #map {
      height: 100%;
      width: 100vw;
      background-color: #1c1c1e;
      overflow: hidden;
    }

    /* Selettore Tipo di Percorso in alto a destra */
    .route-options {
      position: absolute;
      top: 48px;
      right: 16px;
      z-index: 1000;
      background: rgba(30, 30, 35, 0.92);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      padding: 10px 14px;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,0.15);
      display: flex;
      flex-direction: column;
      gap: 6px;
      color: #fff;
      font-size: 13px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }

    .route-options select {
      background: rgba(20, 20, 25, 0.9);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.2);
      padding: 6px 10px;
      border-radius: 10px;
      font-size: 13px;
      outline: none;
    }

    /* Barra di ricerca in basso */
    .search-box {
      position: absolute;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      width: calc(100% - 32px);
      max-width: 480px;
      background: rgba(30, 30, 35, 0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      display: flex;
      padding: 6px 10px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      transition: all 0.3s ease;
    }

    .search-box input {
      flex: 1;
      border: none;
      background: transparent;
      color: #ffffff;
      font-size: 16px;
      padding: 8px 12px;
      outline: none;
    }

    .search-box button {
      background: #0A84FF;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 18px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
    }

    /* Controlli Fluttuanti Laterali */
    .map-controls {
      position: absolute;
      bottom: 105px;
      right: 16px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: all 0.3s ease;
    }

    .btn-ctrl {
      width: 50px;
      height: 50px;
      border-radius: 25px;
      background: rgba(30, 30, 35, 0.92);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
      cursor: pointer;
      backdrop-filter: blur(10px);
    }

    .btn-ctrl.active {
      background: #0A84FF;
      border-color: #0A84FF;
    }

    /* Card Dettagli Locale */
    .place-card {
      position: absolute;
      bottom: -320px;
      left: 0; right: 0;
      z-index: 1001;
      background: #1c1c1e;
      color: #fff;
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      padding: 24px 20px;
      box-shadow: 0 -6px 24px rgba(0, 0, 0, 0.6);
      transition: bottom 0.35s cubic-bezier(0.1, 0.9, 0.2, 1);
      border-top: 1px solid rgba(255,255,255,0.1);
    }

    .place-card.active { bottom: 0; }
    .place-title { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
    .place-sub { font-size: 14px; color: #a1a1a6; margin-bottom: 18px; line-height: 1.4; }

    .btn-route {
      display: block; width: 100%; background: #30d158; color: #000;
      font-weight: 700; text-align: center; padding: 14px; border-radius: 14px;
      border: none; font-size: 16px; cursor: pointer;
    }

    /* Barra Guida Navigazione Attiva Stile Google Maps */
    .nav-bar {
      position: absolute;
      bottom: -150px;
      left: 0; right: 0;
      z-index: 1002;
      background: #1c1c1e;
      color: #fff;
      padding: 20px 24px;
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 -6px 24px rgba(0,0,0,0.6);
      transition: bottom 0.35s ease;
      border-top: 1px solid rgba(255,255,255,0.1);
    }

    .nav-bar.active { bottom: 0; }
    .nav-time { font-size: 26px; font-weight: bold; color: #30d158; }
    .nav-details { font-size: 14px; color: #a1a1a6; margin-top: 2px; }
    
    .btn-stop {
      background: #ff453a; color: white; border: none;
      padding: 12px 22px; border-radius: 16px; font-weight: bold; font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Opzioni Percorso in Alto a Destra -->
  <div class="route-options" id="routeOptions">
    <label for="routeType">Tipo percorso:</label>
    <select id="routeType" onchange="updateRouteIfNavigating()">
      <option value="fastest">Più veloce</option>
      <option value="shortest">Più breve</option>
      <option value="notolls">Senza pedaggi (No autostrada)</option>
    </select>
  </div>

  <!-- Contenitore Mappa 3D -->
  <div id="map"></div>

  <!-- Controlli Fluttuanti -->
  <div class="map-controls" id="mapControls">
    <button class="btn-ctrl active" id="btnSpeedCams" onclick="toggleSpeedCams()" title="Autovelox">📷</button>
    <button class="btn-ctrl" id="btnTraffic" onclick="toggleTraffic()" title="Traffico">🚥</button>
    <button class="btn-ctrl" id="btnCompass" onclick="toggleCompassGyro()" title="Bussola/Giroscopio">🧭</button>
    <button class="btn-ctrl" onclick="locateUser(true)" title="La mia posizione">📍</button>
  </div>

  <!-- Barra di Ricerca in Basso -->
  <div class="search-box" id="searchBox">
    <input type="text" id="searchInput" placeholder="Cerca bar, ristoranti, indirizzi..." />
    <button onclick="searchPlace()">Cerca</button>
  </div>

  <!-- Scheda Locale -->
  <div class="place-card" id="placeCard">
    <div class="place-title" id="cardTitle">Nome Locale</div>
    <div class="place-sub" id="cardSub">Indirizzo e dettagli</div>
    <button class="btn-route" onclick="startNavigation()">Avvia Navigazione 3D</button>
  </div>

  <!-- Barra Guida Attiva -->
  <div class="nav-bar" id="navBar">
    <div>
      <div class="nav-time" id="navTime">-- min</div>
      <div class="nav-details" id="navDetails">Calcolo percorso...</div>
    </div>
    <button class="btn-stop" onclick="stopNavigation()">Esci</button>
  </div>

  <!-- Engine MapLibre GL -->
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>

  <script>
    const mapStyle = {
      "version": 8,
      "sources": {
        "osm-tiles": {
          "type": "raster",
          "tiles": [
            "https://a.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png",
            "https://b.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png"
          ],
          "tileSize": 256,
          "attribution": "&copy; OpenStreetMap contributors"
        },
        "traffic-tiles": {
          "type": "raster",
          "tiles": [
            "https://a.freeway-traffic.com/tiles/traffic/{z}/{x}/{y}.png"
          ],
          "tileSize": 256
        }
      },
      "layers": [
        {
          "id": "osm-tiles-layer",
          "type": "raster",
          "source": "osm-tiles",
          "minzoom": 0,
          "maxzoom": 19
        }
      ]
    };

    const map = new maplibregl.Map({
      container: 'map',
      style: mapStyle,
      center: [12.4964, 41.9028],
      zoom: 6,
      pitch: 0,
      bearing: 0
    });

    let userLocation = null;
    let targetLocation = null;
    let isNavigating = false;
    let watchId = null;
    let userMarker = null;
    let targetMarker = null;
    let isTrafficOn = false;
    let isGyroActive = false;
    let lastBearing = 0;
    let navigationSteps = [];
    let lastSpokenInstructionIndex = -1;

    // Sintesi Vocale Avanzata (TTS)
    function speak(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'it-IT';
        msg.rate = 1.0;
        msg.pitch = 1.0;
        window.speechSynthesis.speak(msg);
      }
    }

    function toggleTraffic() {
      isTrafficOn = !isTrafficOn;
      const btn = document.getElementById('btnTraffic');
      
      if (isTrafficOn) {
        btn.classList.add('active');
        if (!map.getLayer('traffic-layer')) {
          map.addLayer({
            'id': 'traffic-layer',
            'type': 'raster',
            'source': 'traffic-tiles',
            'paint': { 'raster-opacity': 0.7 }
          });
        }
      } else {
        btn.classList.remove('active');
        if (map.getLayer('traffic-layer')) {
          map.removeLayer('traffic-layer');
        }
      }
    }

    function toggleCompassGyro() {
      isGyroActive = !isGyroActive;
      const btn = document.getElementById('btnCompass');

      if (isGyroActive) {
        btn.classList.add('active');
        enableGyro();
      } else {
        btn.classList.remove('active');
        window.removeEventListener('deviceorientation', handleGyroOrientation);
      }
    }

    function enableGyro() {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission().then(response => {
          if (response === 'granted') {
            window.addEventListener('deviceorientation', handleGyroOrientation);
          } else {
            alert("Permesso giroscopio non concesso.");
          }
        }).catch(console.error);
      } else {
        window.addEventListener('deviceorientation', handleGyroOrientation);
      }
    }

    function handleGyroOrientation(e) {
      if (!isGyroActive) return;
      let alpha = e.alpha || e.webkitCompassHeading;
      if (alpha !== undefined && alpha !== null) {
        let smoothedBearing = lastBearing + (alpha - lastBearing) * 0.15;
        lastBearing = smoothedBearing;
        map.setBearing(smoothedBearing);
      }
    }

    function getDistanceMeters(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    // Controllo prossimità passaggi guida vocale
    function checkNavigationVoice(lat, lng) {
      if (!isNavigating || navigationSteps.length === 0) return;

      navigationSteps.forEach((step, index) => {
        if (index > lastSpokenInstructionIndex && step.maneuver && step.maneuver.location) {
          const sLon = step.maneuver.location[0];
          const sLat = step.maneuver.location[1];
          const dist = getDistanceMeters(lat, lng, sLat, sLon);

          if (dist < 40) { // Entro 40 metri dalla manovra
            lastSpokenInstructionIndex = index;
            let instructionText = step.instruction || "Procedi dritto";
            speak(instructionText);
          }
        }
      });
    }

    function locateUser(centerMap = false) {
      if (!navigator.geolocation) return;

      if (watchId) navigator.geolocation.clearWatch(watchId);

      watchId = navigator.geolocation.watchPosition(pos => {
        const lat = pos.coords.latitude;
        const lng = pos.coords.longitude;
        const heading = pos.coords.heading;
        userLocation = [lng, lat];

        if (!userMarker) {
          const el = document.createElement('div');
          el.style.width = '20px';
          el.style.height = '20px';
          el.style.backgroundColor = '#0A84FF';
          el.style.borderRadius = '50%';
          el.style.border = '3px solid white';
          el.style.boxShadow = '0 0 12px rgba(10,132,255,0.9)';
          
          userMarker = new maplibregl.Marker(el).setLngLat(userLocation).addTo(map);
        } else {
          userMarker.setLngLat(userLocation);
        }

        if (isNavigating) {
          let moveBearing = (heading !== null && heading !== undefined) ? heading : map.getBearing();
          map.easeTo({
            center: userLocation,
            zoom: 17.5,
            pitch: 60,
            bearing: moveBearing,
            duration: 800
          });
          checkNavigationVoice(lat, lng);
        } else if (centerMap) {
          map.flyTo({ center: userLocation, zoom: 15, pitch: 0 });
        }
      }, err => console.log(err), {
        enableHighAccuracy: true,
        maximumAge: 1000,
        timeout: 10000
      });
    }

    async function searchPlace() {
      const query = document.getElementById('searchInput').value;
      if (!query) return;

      try {
        const res = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
        const data = await res.json();

        if (data && data.length > 0) {
          const place = data[0];
          targetLocation = [parseFloat(place.lon), parseFloat(place.lat)];
          
          if (targetMarker) targetMarker.remove();
          targetMarker = new maplibregl.Marker({ color: '#ff3b30' })
            .setLngLat(targetLocation)
            .addTo(map);

          map.flyTo({ center: targetLocation, zoom: 15, pitch: 0 });

          document.getElementById('cardTitle').innerText = place.display_name.split(',')[0];
          document.getElementById('cardSub').innerText = place.display_name;
          document.getElementById('placeCard').classList.add('active');
        } else {
          alert("Nessun luogo trovato.");
        }
      } catch (e) {
        alert("Errore durante la ricerca.");
      }
    }

    async function startNavigation() {
      if (!userLocation) {
        alert("Attiva prima il GPS toccando il pulsante 📍");
        return;
      }

      isNavigating = true;
      lastSpokenInstructionIndex = -1;
      document.getElementById('placeCard').classList.remove('active');
      document.getElementById('searchBox').style.display = 'none';
      document.getElementById('routeOptions').style.display = 'none';
      document.getElementById('navBar').classList.add('active');
      document.getElementById('mapControls').style.bottom = '110px';

      map.flyTo({
        center: userLocation,
        zoom: 17.5,
        pitch: 60,
        duration: 1500
      });

      const routeType = document.getElementById('routeType').value;
      let url = `https://router.project-osrm.org/route/v1/driving/${userLocation[0]},${userLocation[1]};${targetLocation[0]},${targetLocation[1]}?overview=full&geometries=geojson&steps=true`;

      if (routeType === 'shortest') {
        url += `&annotations=distance`;
      } else if (routeType === 'notolls') {
        url += `&exclude=toll`;
      }

      try {
        const res = await fetch(url);
        const data = await res.json();

        if (data.routes && data.routes.length > 0) {
          const route = data.routes[0];
          const mins = Math.round(route.duration / 60);
          const km = (route.distance / 1000).toFixed(1);

          // Estrai i passaggi dettagliati per la voce guida
          navigationSteps = [];
          if (route.legs && route.legs[0].steps) {
            navigationSteps = route.legs[0].steps;
          }

          let modeText = "Veloce";
          if (routeType === 'shortest') modeText = "Più breve";
          if (routeType === 'notolls') modeText = "Senza pedaggi";

          document.getElementById('navTime').innerText = `${mins} min`;
          document.getElementById('navDetails').innerText = `${km} km • ${modeText}`;

          const routeGeoJSON = {
            'type': 'Feature',
            'geometry': route.geometry
          };

          if (map.getSource('route')) {
            map.getSource('route').setData(routeGeoJSON);
          } else {
            map.addSource('route', { 'type': 'geojson', 'data': routeGeoJSON });
            map.addLayer({
              'id': 'route',
              'type': 'line',
              'source': 'route',
              'layout': { 'line-join': 'round', 'line-cap': 'round' },
              'paint': { 'line-color': '#0A84FF', 'line-width': 8, 'line-opacity': 0.9 }
            });
          }

          speak(`Navigazione avviata. Distanza ${km} chilometri. Procedi verso la destinazione.`);
        }
      } catch (e) {
        console.log("Errore calcolo percorso");
      }
    }

    function stopNavigation() {
      isNavigating = false;
      navigationSteps = [];
      document.getElementById('navBar').classList.remove('active');
      document.getElementById('searchBox').style.display = 'flex';
      document.getElementById('routeOptions').style.display = 'flex';
      document.getElementById('mapControls').style.bottom = '105px';

      isGyroActive = false;
      document.getElementById('btnCompass').classList.remove('active');
      window.removeEventListener('deviceorientation', handleGyroOrientation);

      map.easeTo({ pitch: 0, bearing: 0, zoom: 14 });

      if (map.getLayer('route')) map.removeLayer('route');
      if (map.getSource('route')) map.removeSource('route');

      speak("Navigazione terminata.");
    }

    function updateRouteIfNavigating() {
      if (isNavigating) startNavigation();
    }

    function toggleSpeedCams() {
      const btn = document.getElementById('btnSpeedCams');
      btn.classList.toggle('active');
    }

    locateUser();
  </script>
</body>
</html>
