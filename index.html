<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Vela Maps" />
  <title>Vela Maps Web 3D</title>
  
  <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-blue.png" />
  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-blue.png" />
  
  <!-- MapLibre GL 3D Engine -->
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Roboto, "Segoe UI", sans-serif;
    }

    html, body, #map {
      height: 100%;
      width: 100vw;
      background-color: #121212;
      overflow: hidden;
    }

    /* Option No Pedaggi */
    .route-options {
      position: absolute;
      top: 48px;
      right: 16px;
      z-index: 1000;
      background: rgba(28, 28, 30, 0.92);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      padding: 8px 14px;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,0.12);
      display: flex;
      align-items: center;
      gap: 8px;
      color: #fff;
      font-size: 13px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }

    .route-options input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: #0A84FF;
    }

    /* Barra di ricerca in basso */
    .search-box {
      position: absolute;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      width: calc(100% - 32px);
      max-width: 480px;
      background: rgba(28, 28, 30, 0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      display: flex;
      padding: 6px 10px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      transition: all 0.3s ease;
    }

    .search-box input {
      flex: 1;
      border: none;
      background: transparent;
      color: #ffffff;
      font-size: 16px;
      padding: 8px 12px;
      outline: none;
    }

    .search-box button {
      background: #0A84FF;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 18px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
    }

    /* Controlli Fluttuanti Laterali */
    .map-controls {
      position: absolute;
      bottom: 105px;
      right: 16px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: all 0.3s ease;
    }

    .btn-ctrl {
      width: 50px;
      height: 50px;
      border-radius: 25px;
      background: rgba(28, 28, 30, 0.92);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
      cursor: pointer;
      backdrop-filter: blur(10px);
    }

    .btn-ctrl.active {
      background: #0A84FF;
      border-color: #0A84FF;
    }

    /* Card Dettagli Locale */
    .place-card {
      position: absolute;
      bottom: -320px;
      left: 0; right: 0;
      z-index: 1001;
      background: #1c1c1e;
      color: #fff;
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      padding: 24px 20px;
      box-shadow: 0 -6px 24px rgba(0, 0, 0, 0.6);
      transition: bottom 0.35s cubic-bezier(0.1, 0.9, 0.2, 1);
      border-top: 1px solid rgba(255,255,255,0.1);
    }

    .place-card.active { bottom: 0; }
    .place-title { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
    .place-sub { font-size: 14px; color: #a1a1a6; margin-bottom: 18px; line-height: 1.4; }

    .btn-route {
      display: block; width: 100%; background: #30d158; color: #000;
      font-weight: 700; text-align: center; padding: 14px; border-radius: 14px;
      border: none; font-size: 16px; cursor: pointer;
    }

    /* Pannello Guida Navigazione Attiva Stile Google Maps */
    .nav-bar {
      position: absolute;
      bottom: -150px;
      left: 0; right: 0;
      z-index: 1002;
      background: #1c1c1e;
      color: #fff;
      padding: 20px 24px;
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 -6px 24px rgba(0,0,0,0.6);
      transition: bottom 0.35s ease;
      border-top: 1px solid rgba(255,255,255,0.1);
    }

    .nav-bar.active { bottom: 0; }
    .nav-time { font-size: 26px; font-weight: bold; color: #30d158; }
    .nav-details { font-size: 14px; color: #a1a1a6; margin-top: 2px; }
    
    .btn-stop {
      background: #ff453a; color: white; border: none;
      padding: 12px 22px; border-radius: 16px; font-weight: bold; font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Filtro No Pedaggi in Alto a Destra -->
  <div class="route-options" id="routeOptions">
    <input type="checkbox" id="avoidTolls" onchange="updateRouteIfNavigating()" />
    <label for="avoidTolls">No pedaggi</label>
  </div>

  <!-- Contenitore Mappa Vector 3D -->
  <div id="map"></div>

  <!-- Controlli Fluttuanti -->
  <div class="map-controls" id="mapControls">
    <button class="btn-ctrl active" id="btnSpeedCams" onclick="toggleSpeedCams()" title="Autovelox (📷)">📷</button>
    <button class="btn-ctrl" onclick="locateUser(true)" title="La mia posizione">📍</button>
  </div>

  <!-- Barra di Ricerca in Basso -->
  <div class="search-box" id="searchBox">
    <input type="text" id="searchInput" placeholder="Cerca bar, ristoranti, indirizzi..." />
    <button onclick="searchPlace()">Cerca</button>
  </div>

  <!-- Scheda Locale -->
  <div class="place-card" id="placeCard">
    <div class="place-title" id="cardTitle">Nome Locale</div>
    <div class="place-sub" id="cardSub">Indirizzo e dettagli</div>
    <button class="btn-route" onclick="startNavigation()">Avvia Navigazione 3D</button>
  </div>

  <!-- Barra Guida Attiva -->
  <div class="nav-bar" id="navBar">
    <div>
      <div class="nav-time" id="navTime">-- min</div>
      <div class="nav-details" id="navDetails">Calcolo percorso...</div>
    </div>
    <button class="btn-stop" onclick="stopNavigation()">Esci</button>
  </div>

  <!-- Engine MapLibre GL -->
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>

  <script>
    // Inizializzazione Mappa 3D Vettoriale Scura
    const map = new maplibregl.Map({
      container: 'map',
      style: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
      center: [12.4964, 41.9028],
      zoom: 6,
      pitch: 0, // Mappa piatta di default
      bearing: 0
    });

    let userLocation = null;
    let targetLocation = null;
    let isNavigating = false;
    let watchId = null;
    let userMarker = null;
    let targetMarker = null;

    function speak(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'it-IT';
        msg.rate = 1.0;
        window.speechSynthesis.speak(msg);
      }
    }

    // Localizzazione e GPS
    function locateUser(centerMap = false) {
      if (!navigator.geolocation) return;

      if (watchId) navigator.geolocation.clearWatch(watchId);

      watchId = navigator.geolocation.watchPosition(pos => {
        const lat = pos.coords.latitude;
        const lng = pos.coords.longitude;
        const heading = pos.coords.heading;
        userLocation = [lng, lat];

        if (!userMarker) {
          const el = document.createElement('div');
          el.style.width = '18px';
          el.style.height = '18px';
          el.style.backgroundColor = '#0A84FF';
          el.style.borderRadius = '50%';
          el.style.border = '3px solid white';
          el.style.boxShadow = '0 0 10px rgba(10,132,255,0.8)';
          
          userMarker = new maplibregl.Marker(el).setLngLat(userLocation).addTo(map);
        } else {
          userMarker.setLngLat(userLocation);
        }

        // Se siamo in Navigazione, la mappa va in 3D (pitch 60°), ingrandisce e ruota verso l'auto
        if (isNavigating) {
          map.easeTo({
            center: userLocation,
            zoom: 17.5,
            pitch: 60, // Inclinazione 3D reale
            bearing: heading || map.getBearing(),
            duration: 1000
          });
        } else if (centerMap) {
          map.flyTo({ center: userLocation, zoom: 15, pitch: 0 });
        }
      }, err => console.log(err), {
        enableHighAccuracy: true,
        maximumAge: 1000,
        timeout: 10000
      });
    }

    // Ricerca Indirizzo
    async function searchPlace() {
      const query = document.getElementById('searchInput').value;
      if (!query) return;

      try {
        const res = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
        const data = await res.json();

        if (data && data.length > 0) {
          const place = data[0];
          targetLocation = [parseFloat(place.lon), parseFloat(place.lat)];
          
          if (targetMarker) targetMarker.remove();
          targetMarker = new maplibregl.Marker({ color: '#ff3b30' })
            .setLngLat(targetLocation)
            .addTo(map);

          map.flyTo({ center: targetLocation, zoom: 15, pitch: 0 });

          document.getElementById('cardTitle').innerText = place.display_name.split(',')[0];
          document.getElementById('cardSub').innerText = place.display_name;
          document.getElementById('placeCard').classList.add('active');
        } else {
          alert("Nessun luogo trovato.");
        }
      } catch (e) {
        alert("Errore durante la ricerca.");
      }
    }

    // Avvio Navigazione in 3D Stile Google Maps
    async function startNavigation() {
      if (!userLocation) {
        alert("Attiva prima il GPS toccando il pulsante 📍");
        return;
      }

      isNavigating = true;
      document.getElementById('placeCard').classList.remove('active');
      document.getElementById('searchBox').style.display = 'none';
      document.getElementById('routeOptions').style.display = 'none';
      document.getElementById('navBar').classList.add('active');
      document.getElementById('mapControls').style.bottom = '110px';

      // Passaggio automatico alla Vista 3D
      map.flyTo({
        center: userLocation,
        zoom: 17.5,
        pitch: 60, // Inclinazione 3D
        duration: 1500
      });

      const avoidTolls = document.getElementById('avoidTolls').checked;
      
      // Calcolo linea percorso
      try {
        const res = await fetch(`https://router.project-osrm.org/route/v1/driving/${userLocation[0]},${userLocation[1]};${targetLocation[0]},${targetLocation[1]}?overview=full&geometries=geojson${avoidTolls ? '&exclude=toll' : ''}`);
        const data = await res.json();

        if (data.routes && data.routes.length > 0) {
          const route = data.routes[0];
          const mins = Math.round(route.duration / 60);
          const km = (route.distance / 1000).toFixed(1);

          document.getElementById('navTime').innerText = `${mins} min`;
          document.getElementById('navDetails').innerText = `${km} km ${avoidTolls ? '• No pedaggi' : '• Percorso veloce'}`;

          const routeGeoJSON = {
            'type': 'Feature',
            'geometry': route.geometry
          };

          if (map.getSource('route')) {
            map.getSource('route').setData(routeGeoJSON);
          } else {
            map.addSource('route', { 'type': 'geojson', 'data': routeGeoJSON });
            map.addLayer({
              'id': 'route',
              'type': 'line',
              'source': 'route',
              'layout': { 'line-join': 'round', 'line-cap': 'round' },
              'paint': { 'line-color': '#30d158', 'line-width': 8, 'line-opacity': 0.85 }
            });
          }

          speak(`Navigazione 3D avviata. Distanza ${km} chilometri.`);
        }
      } catch (e) {
        console.log("Errore percorso");
      }
    }

    function stopNavigation() {
      isNavigating = false;
      document.getElementById('navBar').classList.remove('active');
      document.getElementById('searchBox').style.display = 'flex';
      document.getElementById('routeOptions').style.display = 'flex';
      document.getElementById('mapControls').style.bottom = '105px';

      // Ripristina la mappa in 2D dall'alto
      map.easeTo({ pitch: 0, bearing: 0, zoom: 14 });

      if (map.getLayer('route')) map.removeLayer('route');
      if (map.getSource('route')) map.removeSource('route');

      speak("Navigazione terminata.");
    }

    function updateRouteIfNavigating() {
      if (isNavigating) startNavigation();
    }

    function toggleSpeedCams() {
      const btn = document.getElementById('btnSpeedCams');
      btn.classList.toggle('active');
    }

    locateUser();
  </script>
</body>
</html>
